services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_started
    entrypoint: >
      /bin/sh -c "sleep 10 && curl -fsS -X POST http://ollama:11434/api/pull -d '{\"name\":\"qwen3:1.7b\"}'"
    restart: "no"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: .
    image: alfa-credit-frontend:local
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
